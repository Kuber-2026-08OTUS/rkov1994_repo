apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-templating
  namespace: argocd
spec:
  project: otus

  source:
    repoURL: https://github.com/Kuber-2026-08OTUS/rkov1994_repo.git
    targetRevision: kubernetes-templating
    path: kubernetes-templating/homework

    helm:
      parameters:
        - name: replicaCount
          value: "2"

  destination:
    server: https://kubernetes.default.svc
    namespace: homeworkhelm

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
