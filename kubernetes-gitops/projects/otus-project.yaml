apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: otus
  namespace: argocd
spec:
  description: OTUS Kubernetes GitOps homework

  sourceRepos:
    - https://github.com/Kuber-2026-08OTUS/rkov1994_repo.git

  destinations:
    - namespace: homework
      server: https://kubernetes.default.svc
    - namespace: homeworkhelm
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
